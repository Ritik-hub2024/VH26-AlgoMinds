[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Pure AST-based Python static analyzer for detecting resource and memory leaks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "LeakGuard Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
leakguard = "leakguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["leakguard*", "parser*", "analyzer*", "models*", "reporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyrefly]
project-includes = [
    "analyzer/**/*.py",
    "backend/**/*.py",
    "benchmark/**/*.py",
    "examples/**/*.py",
    "leakguard/**/*.py",
    "models/**/*.py",
    "parser/**/*.py",
    "python/**/*.py",
    "reporter/**/*.py",
    "tests/**/*.py",
    "*.py",
]
project-excludes = [
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "examples/invalid_syntax_sample.py",
    "python/syntax/invalid_python.py",
]
search-path = [
    ".",
    "backend",
]

