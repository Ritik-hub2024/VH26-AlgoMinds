[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Pure AST Python Static Analyzer for Detecting Resource Leaks"
readme = "../README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
leakguard = "leakguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["leakguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
